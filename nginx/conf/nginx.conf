worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Группа экземпляров Valuator.
    # Метод по умолчанию - round robin (по кругу).
    # Для экспериментов раскомментируйте ОДНУ из директив ниже:
    upstream valuator {
        #least_conn;      # к серверу с наименьшим числом активных соединений
        #ip_hash;         # один клиент (по IP) -> всегда один и тот же сервер
        #hash $request_uri consistent;  # привязка по произвольному ключу

        server 127.0.0.1:5001;   # можно добавить weight=3
        server 127.0.0.1:5002;
        #server 127.0.0.1:5003;
        #server 127.0.0.1:5004;
    }

    server {
        listen       8080;
        server_name  localhost;

        location / {
            proxy_pass         http://valuator;
            proxy_http_version 1.1;
            # $http_host (а не $host) сохраняет порт :8080, иначе редиректы приложения (например, на /Login) уходят на порт 80
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # при отказе экземпляра пробуем следующий
            proxy_next_upstream error timeout http_502 http_503;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
